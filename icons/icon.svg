<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="0.45" stop-color="#4A2BC2"/>
      <stop offset="1" stop-color="#140A3A"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.78" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#E879F9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4DCFF"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4BFF"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B0426" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#shine)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Chat bubble -->
  <g filter="url(#shadow)">
    <path fill="url(#bubble)" d="
      M 180 116 H 332 A 84 84 0 0 1 416 200 V 288 A 84 84 0 0 1 332 372
      H 236 L 150 428 Q 136 437 140 420 L 152 364
      A 84 84 0 0 1 96 288 V 200 A 84 84 0 0 1 180 116 Z"/>
  </g>

  <!-- Sparkles (the optimizer) -->
  <path fill="url(#spark)" d="M 256 160 Q 266 234 330 244 Q 266 254 256 328 Q 246 254 182 244 Q 246 234 256 160 Z"/>
  <path fill="url(#spark)" opacity="0.85" d="M 346 152 Q 350 178 372 182 Q 350 186 346 212 Q 342 186 320 182 Q 342 178 346 152 Z"/>
</svg>
